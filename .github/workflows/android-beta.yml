name: Android Beta APK

# Build and publish a Fizzer sideload APK when repository signing is configured.

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'client/**'
      - 'capacitor.config.*'
      - 'scripts/prepare-android-codex-runtime.mjs'
      - 'scripts/prepare-capacitor-assets.mjs'
      - '.github/workflows/android-beta.yml'
  workflow_dispatch:

concurrency:
  group: android-beta
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure stable beta signing
        id: signing
        env:
          ANDROID_BETA_KEYSTORE_B64: ${{ secrets.ANDROID_BETA_KEYSTORE_B64 }}
          ANDROID_BETA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_BETA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_BETA_KEYSTORE_B64" || -z "$ANDROID_BETA_KEYSTORE_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Android signing is not configured; skipping the APK build."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$ANDROID_BETA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fizzer-beta.jks"
          chmod 600 "$RUNNER_TEMP/fizzer-beta.jks"
          {
            echo "FIZZER_ANDROID_KEYSTORE=$RUNNER_TEMP/fizzer-beta.jks"
            echo "FIZZER_ANDROID_KEYSTORE_PASSWORD=$ANDROID_BETA_KEYSTORE_PASSWORD"
            echo "FIZZER_ANDROID_KEY_ALIAS=fizzer-beta"
            echo "FIZZER_ANDROID_KEY_PASSWORD=$ANDROID_BETA_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.signing.outputs.configured == 'true'
        run: npm ci

      - name: Build debug APK
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: npm run android:apk

      - name: Publish to android-dev release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f client/public/cascade-android.apk
          ls -la client/public/cascade-android.apk
          if ! gh release view android-dev >/dev/null 2>&1; then
            gh release create android-dev \
              --title "Fizzer Android Beta" \
              --notes "Signed Fizzer sideload beta."
          fi
          gh release upload android-dev client/public/cascade-android.apk --clobber
          echo "Published cascade-android.apk to release android-dev"
