name: Deploy Production

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/user-guide.md'
      - '!**/*.test.*'
      - '!backend_elixir/test/**'
      - '!AGENTS.md'
      - '!README.md'
  workflow_dispatch:
  workflow_run:
    workflows: [Desktop builds]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Configure pinned deploy identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/production_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/production_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/production_deploy >/dev/null

      - name: Deploy exact triggering revision
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          # Resolve after acquiring workflow concurrency, including time queued.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            CURRENT_MASTER="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
            if [[ "$CURRENT_MASTER" != "$REVISION" ]]; then
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              echo "Skipped installer refresh for superseded desktop revision $REVISION." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/production_deploy -p "$PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=90 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $REVISION"

      - name: Verify exact live revision and internal health
        if: steps.delivery.outputs.skipped != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/production_deploy -p "$PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "verify $REVISION"

      - name: Verify public health
        if: steps.delivery.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            --connect-timeout 5 --max-time 15 https://cscd.online/api/health \
            | jq -e '.status == "ok"'
