[package]
name = "cascade-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { path = "vendor/ratatui/ratatui", version = "0.30" }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
color-eyre = "0.6"
futures-util = "0.3"
unicode-width = "0.2"
arboard = "3"
base64 = "0.22"
png = "0.17"

