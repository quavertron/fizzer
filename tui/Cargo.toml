[package]
name = "fizzer"
version = "0.1.0"
edition = "2024"
autotests = false

[[bin]]
name = "fizzer"
path = "src/main.rs"

[dependencies]
ratatui = { path = "vendor/ratatui/ratatui", version = "0.30" }
ratatui-hypertile = { version = "=0.4.1", default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
color-eyre = "0.6"
futures-util = "0.3"
unicode-width = "0.2"
portable-pty = "0.9"
vt100 = "0.16"
arboard = "3"
base64 = "0.22"
png = "0.17"

[patch.crates-io]
ratatui = { path = "vendor/ratatui/ratatui" }
