# Include INSIDE the existing HTTPS server block; reuse its domain/certificate.
# Do not expose /twirp publicly. LiveKit room service is app-network only.
location ^~ /voice/twirp/ { return 404; }
location ^~ /voice/ {
    proxy_pass http://127.0.0.1:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    # URLs carry short-lived join tokens. Never put these in access logs.
    access_log off;
}
