er-radius:6px;background:var(--bg-raised);color:var(--text-primary);padding:9px 12px;font-size:.8rem;line-height:1.4}.chat-composer textarea:focus{border-color:var(--border);outline:none}.chat-composer .btn-icon{height:36px}.chat-send-btn{border:1px solid color-mix(in srgb,var(--accent) 46%,var(--border));background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 22%,var(--bg-raised)),color-mix(in srgb,var(--accent) 12%,var(--bg-raised)));color:var(--accent-hover);box-shadow:var(--bevel),0 0 12px hsla(38,92%,50%,.14)}.chat-send-btn:hover{border-color:color-mix(in srgb,var(--accent) 62%,var(--border));color:var(--accent-hover)}

<body>
<div class="app-shell" id="prototypeShell">
  <aside class="sidebar" aria-label="Fizzer project navigation">
    <nav class="vault-rail" aria-label="Projects">
      <div class="vault-rail-list">
        <button class="vault-rail-button is-active" data-view="project" title="Open project" aria-label="Open project">
          <svg class="gem-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 59 32 32 61 5 32 32 3Z" fill="#0d0b0a" stroke="#df9d3b" stroke-width="2"/><path d="M18 15h28l6 10-20 31L12 25l6-10Z" fill="#12100e" stroke="#e5aa50" stroke-width="2"/><path d="M18 15 32 56 46 15M12 25h40M22 25l10-10 10 10" fill="none" stroke="#e5aa50" stroke-width="1.5"/></svg>
        </button>
        <button class="vault-rail-action" data-view="setup" title="New project" aria-label="New project">+</button>
      </div>
      <button class="vault-rail-action" data-action="reset" title="Reset sample data" aria-label="Reset sample data">↺</button>
    </nav>
    <div class="sidebar-panel">
      <header class="sidebar-header"><div class="vault-name"><span class="vault-name-copy"><span class="vault-name-text" id="projectName">Fizzer</span><span class="vault-name-meta">Product & delivery</span></span></div></header>
      <div class="pp-nav-search"><input id="navSearch" type="search" aria-label="Filter project navigation" placeholder="Filter navigation…"></div>
      <div class="folder-tree" id="projectNavigation"></div>
      <footer class="sidebar-footer"><div class="user-info"><span class="user-avatar" id="userAvatar">F</span><label class="pp-user-label">Viewing as<select id="currentUser" aria-label="Preview as human"><option>Fred</option><option>Tyler</option><option>Diego</option></select></label></div></footer>
    </div>
  </aside>
  <main class="workspace">
    <nav class="tab-bar" aria-label="Workspace navigation"><button class="tab-sidebar-toggle" id="sidebarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button><button class="tab-item" data-view="project">Project</button><button class="tab-item active" id="currentViewTab">Overview</button><span class="toolbar-spacer"></span><button class="tab-item" data-view="channel" data-id="general"># product</button></nav>
    <div class="pp-demo-strip"><span><strong>PROTOTYPE</strong> Fictional project data · changes reset on reload</span><label><input type="checkbox" id="runnerOnline" checked> PM online</label><button data-action="reset">Reset</button></div>
    <div id="prototypeContent" class="pp-content"></div>
  </main>
</div>
<div id="prototypeNotice" class="pp-notice hidden" role="status" aria-live="polite"></div>
<nav id="prototypeSwitcher" class="pp-switcher" aria-label="Prototype variations"><button id="previousVariant" aria-label="Previous layout">←</button><button id="variantLabel" title="Return to project overview">A — Work board</button><button id="nextVariant" aria-label="Next layout">→</button><span class="pp-switcher-divider"></span><button id="showState">State</button></nav>
<dialog id="taskDialog" class="pp-dialog" aria-label="Edit task"></dialog>
<dialog id="missionDialog" class="pp-dialog" aria-label="Create mission"></dialog>
<dialog id="stateDialog" class="pp-dialog pp-state-dialog" aria-label="Prototype state"><header><h2>In-memory preview state</h2><button data-close="stateDialog" aria-label="Close state">×</button></header><p class="pp-muted">Sample state only. This is not a proposed backend schema.</p><pre id="stateContent"></pre></dialog>
<script type="module" src="./projects-areas-prototype.js"></script>
</body>
</html>
